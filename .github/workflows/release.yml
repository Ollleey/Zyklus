# Release der Desktop-Anwendung in der Cloud (manuell starten: Actions → Release → Run workflow).
# Baut Installer .exe/.msi und portable .exe (Linux .AppImage/.deb mit ZYKLUS_LINUX = true) und
# legt einen Release-Entwurf mit latest.json für die Update-Suche an. Braucht die Secrets
# TAURI_SIGNING_PRIVATE_KEY (und ggf. TAURI_SIGNING_PRIVATE_KEY_PASSWORD).
# Lokal geht dasselbe mit `node scripts/release.mjs` (siehe docs/desktop/README.md).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(vars.ZYKLUS_LINUX == 'true' && '["windows-latest","ubuntu-22.04"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Linux-Abhängigkeiten
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Bauen und Release-Entwurf anlegen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: >-
            ${{ startsWith(matrix.platform, 'ubuntu') && '--bundles appimage,deb' || '' }}
            --config {"bundle":{"createUpdaterArtifacts":true}}
          includeUpdaterJson: true
          tagName: v__VERSION__
          releaseName: 'ZYKLUS v__VERSION__'
          releaseBody: 'Installer für Windows (.exe, .msi) und portable .exe. Unsigniert – siehe docs/desktop/README.md.'
          releaseDraft: true

      - name: Portable .exe hochladen
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/desktop-portable.mjs
          gh release upload "v$(node -p "require('./package.json').version")" apps/desktop/src-tauri/target/release/bundle/portable/*.exe --clobber
