# Release der Desktop-Anwendung: bei einem Tag v* bauen und als Entwurf eines GitHub-Releases
# hochladen (Installer .exe/.msi und portable .exe; Linux .AppImage/.deb, sobald zugeschaltet).
# Linux zuschalten: Repository-Variable ZYKLUS_LINUX = true (Settings → Variables → Actions).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(vars.ZYKLUS_LINUX == 'true' && '["windows-latest","ubuntu-22.04"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Linux-Abhängigkeiten
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Version des Tags prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zur Version $v in package.json"; exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Bauen und Release-Entwurf anlegen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: ${{ startsWith(matrix.platform, 'ubuntu') && '--bundles appimage,deb' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: 'ZYKLUS ${{ github.ref_name }}'
          releaseBody: 'Installer für Windows (.exe, .msi) und portable .exe. Unsigniert – siehe docs/desktop/README.md.'
          releaseDraft: true

      - name: Portable .exe hochladen
        if: startsWith(matrix.platform, 'windows') && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/desktop-portable.mjs
          gh release upload "${GITHUB_REF_NAME}" apps/desktop/src-tauri/target/release/bundle/portable/*.exe --clobber
