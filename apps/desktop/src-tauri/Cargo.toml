[package]
name = "zyklus"
version = "0.1.0"
description = "ZYKLUS – Steuerungsbau nach Auftrag"
edition = "2021"

[lib]
name = "zyklus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
